# The main pipeline for Lab5

resources:
  pipelines:
    Lab5_etl:
      name: Lab5_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/Lab5_etl"

      libraries:
        - glob:
            include: ../src/Lab5_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
