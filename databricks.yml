bundle:
  name: ronevych_videogames

include:
  - resources/*.yml

variables:
  catalog:
    description: "Catalog name"
    default: dbr_dev
  schema:
    description: "Schema name"
    default: ronevych_gold
  sql_warehouse_id:
    description: "ID of the SQL Warehouse"
    default: "bfab7bf7a47d6172" 

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
    variables:
      catalog: dbr_dev
      schema: ronevych_gold

  test:
    mode: production
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${target.name}
    variables:
      catalog: dbr_dev
      schema: ronevych_test

resources:
  pipelines:
    ronevych_vgs_pipeline:
      name: "[${bundle.target} ronevych] lab6_videogames_etl"
      catalog: ${var.catalog}
      target: ${var.schema}
      
      configuration:
        spark.env.PYTHONPATH: "${workspace.file_path}/src/Lab5"

      libraries:
        - file: { path: ./src/Lab5/utilities/data_contracts.py }
        - file: { path: ./src/Lab5/transformations/01_bronze.py }
        - file: { path: ./src/Lab5/transformations/02_silver_scd.py } # ВИПРАВЛЕНО ТУТ
        - file: { path: ./src/Lab5/transformations/03_silver_latest.py }
        - file: { path: ./src/Lab5/transformations/04_gold.py }
      
      serverless: true