bundle:
  name: ronevych_videogames

include:
  - resources/*.yml

variables:
  catalog:
    description: "Catalog name"
    default: ronevych_test
  schema:
    description: "Schema name"
    default: gold
  sql_warehouse_id:
    description: "ID of the SQL Warehouse"
    default: "a1f04664c7fcffa4"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
    variables:
      catalog: dbr_dev
      schema: ronevych_gold
    resources:
      pipelines:
        ronevych_vgs_pipeline:
          name: "[dev ronevych] lab6_videogames_etl"
          catalog: dbr_dev
          target: ronevych_gold
          configuration:
            spark.env.PYTHONPATH: "${workspace.file_path}/src/Lab5"
          libraries:
            - file: { path: ./src/Lab5/utilities/data_contracts.py }
            - file: { path: ./src/Lab5/transformations/01_bronze.py }
            - file: { path: ./src/Lab5/transformations/02_silver_scd.py }
            - file: { path: ./src/Lab5/transformations/03_silver_latest.py }
            - file: { path: ./src/Lab5/transformations/04_gold.py }
          serverless: true

  test:
    mode: production
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ronevych_test
      schema: gold
    resources:
      pipelines:
        ronevych_vgs_pipeline_test:
          name: "[test ronevych] lab6_videogames_etl_managed"
          catalog: ronevych_test
          target: gold
          configuration:
            spark.env.PYTHONPATH: "${workspace.file_path}/src/Lab5"
          libraries:
            - file: { path: ./src/Lab5/utilities/data_contracts.py }
            - file: { path: ./src/Lab5/transformations/01_bronze.py }
            - file: { path: ./src/Lab5/transformations/02_silver_scd.py }
            - file: { path: ./src/Lab5/transformations/03_silver_latest.py }
            - file: { path: ./src/Lab5/transformations/04_gold.py }
          serverless: true

resources:
  dashboards: