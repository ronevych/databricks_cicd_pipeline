bundle:
  name: ronevych_videogames

include:
  - resources/*.yml

variables:
  catalog:
    description: "Catalog name"
    default: ronevych_test
  schema:
    description: "Primary schema for metadata" 
    default: gold
  sql_warehouse_id:
    description: "ID of the SQL Warehouse"
    default: "a1f04664c7fcffa4"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
      root_path: /Users/${workspace.current_user.userName}/Lab7/dev
    variables:
      catalog: ronevych_test
      schema: gold

  test:
    mode: production
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
      root_path: /Users/${workspace.current_user.userName}/Lab7/test
    variables:
      catalog: ronevych_test
      schema: gold
    permissions:
      - user_name: lbiel@softserve.academy
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW

resources:
  pipelines:
    ronevych_vgs_pipeline:
      name: "[${bundle.target} ronevych] lab7_videogames_etl"
      catalog: ${var.catalog}
      target: ${var.schema}
      
      clusters:
        - label: default
          node_type_id: "Standard_F4"
          num_workers: 1
          
      configuration:
        spark.env.PYTHONPATH: "${workspace.file_path}/src/Lab5"
      libraries:
        - file: { path: ./src/Lab5/utilities/data_contracts.py }
        - file: { path: ./src/Lab5/transformations/01_bronze.py }
        - file: { path: ./src/Lab5/transformations/02_silver_scd.py }
        - file: { path: ./src/Lab5/transformations/03_silver_latest.py }
        - file: { path: ./src/Lab5/transformations/04_gold.py }

  jobs:
    ronevych_lab7_workflow:
      name: "[${bundle.target}] VideoGames End-to-End Workflow"
      job_clusters:
        - job_cluster_key: security_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_F4"
            num_workers: 1
      tasks:
        - task_key: run_gold_layer_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ronevych_vgs_pipeline.id}

        - task_key: apply_rls_cls
          depends_on:
            - task_key: run_gold_layer_pipeline
          job_cluster_key: security_cluster
          notebook_task:
            notebook_path: ${workspace.file_path}/src/Lab5/security/security_policies.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}