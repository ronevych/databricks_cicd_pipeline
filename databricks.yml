bundle:
  name: ronevych_videogames

targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net

  test:
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${target.name}

resources:
  pipelines:
    ronevych_vgs_pipeline:
      name: "[${bundle.target} ronevych] lab6_videogames_etl"
      catalog: dbr_dev
      target: ronevych_gold_test 
      
      configuration:
        spark.env.PYTHONPATH: "${workspace.file_path}/src/Lab5"

      libraries:
        - file: { path: ./src/Lab5/utilities/data_contracts.py }
        - file: { path: ./src/Lab5/transformations/01_bronze.py }
        - file: { path: ./src/Lab5/transformations/02_silver_scd.py }
        - file: { path: ./src/Lab5/transformations/03_silver_latest.py }
        - file: { path: ./src/Lab5/transformations/04_gold.py }
      
      development: true
      serverless: true